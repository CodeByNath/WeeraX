<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>WeeraX — Digital Portfolio</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap");

      :root { --ink: #0a0a0a; --paper: #f0efe9; --muted: #8a8a85; --line: rgba(240, 239, 233, .15); --lime: #c6ff3f; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--ink); }
      body { color: var(--paper); font-family: "Manrope", Arial, sans-serif; overflow: hidden; }

      .shell {
        isolation: isolate; height: 100svh; min-height: 620px; overflow: hidden; position: relative;
        padding: clamp(1.25rem, 2.6vw, 2.75rem); display: grid; grid-template-rows: auto 1fr auto;
        background: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px), var(--ink);
        background-size: 100% 25%, 25% 100%, auto;
      }
      .noise, .halo { pointer-events: none; position: absolute; inset: 0; }
      .noise { z-index: -1; opacity: .11; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E"); mix-blend-mode: screen; }
      .halo { z-index: -2; inset: auto -10vw -30vh auto; width: min(60vw, 800px); height: min(60vw, 800px); border-radius: 50%; background: var(--lime); filter: blur(140px); opacity: .13; }
      .topbar, .footer, .meta { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
      .topbar { font: 500 .72rem/1 "DM Mono", monospace; letter-spacing: .06em; text-transform: uppercase; }
      .brand { display: flex; align-items: center; gap: .55rem; font-family: "Manrope", sans-serif; font-weight: 800; font-size: .9rem; letter-spacing: -.04em; }
      .brand-mark { width: .7rem; height: .7rem; display: inline-block; background: var(--lime); transform: rotate(45deg); }
      .availability { color: var(--muted); }.availability b { color: var(--lime); font-weight: 500; }

      .hero { align-self: stretch; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(180px, .7fr); grid-template-rows: 1fr auto; gap: 1.5rem; padding-top: clamp(2.5rem, 7vh, 6.8rem); }
      .hero-copy { align-self: end; }.eyebrow { margin: 0 0 1.4rem; color: var(--muted); font: 500 .71rem/1.35 "DM Mono", monospace; letter-spacing: .05em; text-transform: uppercase; }
      h1 { margin: 0; max-width: 10ch; font-size: clamp(3.6rem, 10.7vw, 10.7rem); line-height: .82; letter-spacing: -.095em; font-weight: 700; } h1 em { color: var(--lime); font-style: normal; }
      .intro { margin: clamp(1.6rem, 4vh, 3rem) 0 0; max-width: 29rem; color: #bcbbb5; font-size: clamp(.94rem, 1.35vw, 1.15rem); line-height: 1.5; }
      .work-panel { min-height: 16rem; position: relative; overflow: hidden; align-self: end; border: 1px solid var(--line); padding: 1.2rem; display: flex; flex-direction: column; justify-content: space-between; background: rgba(240, 239, 233, .025); }
      .work-panel::before { content: "W"; position: absolute; right: -.12em; bottom: -.32em; color: var(--lime); font-size: clamp(11rem, 24vw, 22rem); line-height: 1; letter-spacing: -.18em; font-weight: 800; opacity: .9; }
      .work-panel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(140deg, transparent 45%, rgba(198,255,63,.3)); mix-blend-mode: screen; }
      .panel-label, .panel-number { position: relative; z-index: 1; font: 500 .67rem/1 "DM Mono", monospace; letter-spacing: .04em; text-transform: uppercase; }.panel-label { color: var(--muted); }
      .panel-number { display: flex; justify-content: space-between; color: var(--ink); background: var(--lime); margin: 0 -1.2rem -1.2rem; padding: .75rem 1.2rem; }
      .footer { border-top: 1px solid var(--line); padding-top: 1rem; font: 500 .68rem/1 "DM Mono", monospace; letter-spacing: .04em; text-transform: uppercase; }.footer a { color: inherit; text-decoration: none; }.footer a:hover { color: var(--lime); }.scroll-note { color: var(--muted); }

      @media (max-width: 700px) { .shell { min-height: 100svh; padding: 1.1rem; background-size: 100% 25%, 33.333% 100%, auto; }.availability { display: none; }.hero { grid-template-columns: 1fr; grid-template-rows: auto 1fr; padding-top: 2.5rem; gap: 1rem; }.hero-copy { align-self: start; } h1 { max-width: 8ch; font-size: clamp(3.5rem, 17vw, 6rem); }.intro { margin-top: 1.25rem; font-size: .92rem; max-width: 25rem; }.work-panel { min-height: 11rem; width: min(100%, 24rem); justify-self: end; }.footer { font-size: .59rem; }.scroll-note { display: none; } }
      @media (max-height: 700px) and (min-width: 701px) { .shell { min-height: 540px; }.hero { padding-top: 2rem; } h1 { font-size: clamp(3.3rem, 9vw, 7.5rem); }.intro { margin-top: 1rem; }.work-panel { min-height: 11rem; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="noise" aria-hidden="true"></div><div class="halo" aria-hidden="true"></div>
      <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"></span> WeeraX</div><div class="availability"><b>●</b> Available for select work</div><div>Portfolio / 2026</div></header>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy"><p class="eyebrow">Digital portfolio — under construction</p><h1 id="hero-title">Ideas with <em>weight.</em></h1><p class="intro">A focused collection of design, development, and digital experiments. The full archive is taking shape.</p></div>
        <aside class="work-panel" aria-label="Portfolio preview"><span class="panel-label">Selected work</span><div class="panel-number"><span>01</span><span>In progress</span></div></aside>
      </section>
      <footer class="footer"><span>Let’s work together</span><span class="scroll-note">One screen · all signal</span><span>© WeeraX</span></footer>
    </main>
  </body>
</html>
